<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart - Shopping Cart</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navigation -->
<header class="navbar">

    <div class="logo">
        <h1>ShopHub</h1>
    </div>

    <ul class="nav-links">
        <li><a href="/dashboard">dashboard</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/cart">Cart</a></li>
        <li><a href="/profile">Profile</a></li>
        <li><a href="/">Logout</a></li>
    </ul>

</header>

<section class="cart-section">
    <h2>Shopping Cart</h2>

    <table class="cart-table">
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
          
        <tr>
            <td>Gaming Laptop</td>
            <td>₹75,000</td>
            <td>1</td>
            <td>₹75,000</td>
        </tr>
        <tr>
            <td>Smart Phone</td>
            <td>₹22,999</td>
            <td>1</td>
            <td>₹22,999</td>
        </tr>
        <tr>
            <td>Wireless Headphone</td>
            <td>₹2,999</td>
            <td>2</td>
            <td>₹5,999</td>
        </tr>

    </table>

    <div class="cart-summary">
        <h2>Grand Total</h2>
        <h1>₹1,01,997</h1>

        <button class="checkout-btn">
            Proceed to Checkout
        </button>
    </div>
</section>

<footer>
    <p>© 2026 TechKart | Happy Shopping</p>
</footer>

</body>
</html>
